# Entorno local completo:  docker compose up --build
# API y documentación interactiva en http://localhost:8000/docs
# Consola de MinIO (fotos) en http://localhost:9001  (minioadmin / minioadmin)
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/zz-vigilant.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vigilant"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data

  api:
    build: ./backend
    environment: &env
      DATABASE_URL: postgresql+psycopg://vigilant:vigilant@db:5432/vigilant
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: solo-para-desarrollo-local-cambiar-en-produccion
      ALERTAS_MODO: cola
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: ./backend
    command: ["arq", "app.worker.WorkerSettings"]
    environment: *env
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  miniodata:
